[package]
name = "allies"
version = "0.1.0"
description = "Keep track of the people who matter to you"
authors = ["Petrus Johannes Maas"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "allies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-fs = "2.7.1"

# The WebdriverIO plugins sit behind an optional feature, so a normal build
# never compiles them. Cargo ignores debug_assertions in a target selector, so
# `npm run test:e2e` passes `--features wdio` instead.
[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies.tauri-plugin-wdio]
version = "1"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version = "1"
optional = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
